[project]
name = "ccr"
version = "0.1.0"
description = "Route Claude Code tasks to the cheapest sufficient model and effort"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pyyaml>=6", "tree-sitter-language-pack>=0.2"]

[project.scripts]
ccr = "ccr.entry:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 110
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W"]
