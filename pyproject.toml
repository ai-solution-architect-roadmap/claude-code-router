[project]
name = "claude-code-router"
version = "0.1.0"
description = "Route Claude Code tasks to the cheapest sufficient model and effort"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "Satya Prakash Tiwari" }]
keywords = ["claude-code", "llm", "routing", "model-routing", "cost-optimization", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = ["typer>=0.12", "pyyaml>=6", "tree-sitter-language-pack>=0.2"]

[project.urls]
Homepage = "https://github.com/ai-solution-architect-roadmap/claude-code-router"
Documentation = "https://github.com/ai-solution-architect-roadmap/claude-code-router/blob/main/docs/REFERENCE.md"
Changelog = "https://github.com/ai-solution-architect-roadmap/claude-code-router/blob/main/CHANGELOG.md"
Issues = "https://github.com/ai-solution-architect-roadmap/claude-code-router/issues"

[project.scripts]
ccr = "ccr.entry:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 110
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C901"]
ignore = [
    "B008",   # typer.Option/Argument in defaults is the typer idiom
    "SIM905", # word lists as split() strings are easier to maintain
    "SIM112", # Windows env var names are case-sensitive spellings we look up on purpose
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"ccr/history/dashboard.py" = ["E501"]   # embedded HTML/JS template
